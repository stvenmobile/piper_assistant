assistant:
  name: "Piper"
  engaged_timeout_seconds: 20.0
  max_conversation_turns: 8

llm:
  provider: "ollama"
  base_url: "http://192.168.1.150:11434"
  model: "llama3.2:latest"   # the 3B model - Ollama on the PC has it tagged "latest", not "3b"
  temperature: 0.4
  keep_alive: "2h"     # keep the model loaded on the PC (a cold load took ~80 s)

audio:
  # Any unique part of the device names - list them with: python3 src/piper_audio/devices.py
  # For the SP-200 speakerphone (mic and speaker in one), set both hints to its name.
  mic_device_hint: "sp200"
  speaker_device_hint: "sp200"
  mic_channel: 0       # SP-200: 0 = echo-cancelled voice (1-4 raw mics, 5 speaker reference) - tools/audio/mic_channels.py
  hardware_rate: 48000
  whisper_rate: 16000
  whisper_model: "base.en"
  whisper_compute: "int8"
  # TTS Engine Selection: "kokoro" (GPU) or "piper" (CPU)
  tts_engine: "kokoro"
  kokoro_voice: "af_heart"
  # Voice synthesis configuration (Piper engine)
  voice_model: "en_US-hfc_female-medium.onnx"

  volume: 0.3          # Piper's voice level (0..1). Audio goes straight to the SP-200, so this is
                       #   the volume control: ~0.2 quiet, ~0.5 loud
  length_scale: 0.95   # Speech rate: values < 1.0 produce slightly faster, more natural cadence
  noise_scale: 0.667   # Phoneme pitch/inflection variation
  noise_w: 0.8         # Phoneme duration variability

weather:
  location: "Matthews,NC"
  cache_minutes: 10    # fetched at most this often (it used to be fetched on every LLM reply)
