[project]
name = "piper-assistant"
version = "0.2.0"
description = "Piper: local voice assistant runtime for the Jetson (voice, brain, and the piper-watch head)"
requires-python = ">=3.10"

# Runtime dependencies live in requirements.txt (several are Jetson-specific builds);
# tests need only requirements-dev.txt.

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# The Jetson's system-wide ROS 2 install ships pytest plugins that are too old for pytest 8;
# the tests need none (or run with PYTEST_DISABLE_PLUGIN_AUTOLOAD=1).
addopts = ["-p", "no:launch_testing", "-p", "no:launch_ros"]
